<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sterling Prime — 3D Premium Concept</title>
<meta name="description" content="Concept preview for a premium Sterling Prime corporate gifting website redesign.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Sterling Prime upgrade layer – uses the site's existing theme tokens */
.hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.hero-cta a{padding:14px 28px;border-radius:50px;font-weight:700;text-decoration:none;cursor:pointer}
.hero-cta .p{background:var(--gradient);color:#fff;box-shadow:0 10px 25px rgba(230,34,99,.25)}
.hero-cta .s{background:#fff;color:var(--primary);border:2px solid var(--border-light)}
.btn-quote{flex:1;border:1.5px solid var(--primary);background:#fff;color:var(--primary);border-radius:50px;padding:8px 10px;font-weight:700;cursor:pointer;font-size:.85rem}
.btn-quote.on{background:var(--primary);color:#fff}
#q-fab{position:fixed;left:28px;bottom:96px;z-index:1001;border:0;border-radius:50px;padding:14px 22px;background:var(--gradient);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 10px 25px rgba(43,46,131,.3);display:none}
#q-fab b{background:#fff;color:var(--secondary);border-radius:50px;padding:1px 9px;margin-left:8px}
#q-dim{position:fixed;inset:0;background:rgba(20,20,50,.45);z-index:1003;display:none}
#q-drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;background:#fff;z-index:1004;transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
#q-drawer.open{transform:none}#q-dim.open{display:block}
#q-drawer header{position:static;padding:16px 20px;background:var(--gradient);color:#fff;display:flex;justify-content:space-between;align-items:center}
#q-drawer header button{background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer}
#q-list{flex:1;overflow:auto;padding:12px 16px}
.q-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-light)}
.q-item img{width:52px;height:52px;object-fit:cover;border-radius:8px}
.q-item div{flex:1;font-size:.88rem}.q-item small{color:var(--text-light)}
.q-item button{border:0;background:none;color:var(--secondary);font-size:1.2rem;cursor:pointer}
#q-form{padding:14px 16px;border-top:1px solid var(--border-light);display:grid;gap:8px;background:#faf8fd}
#q-form input,#q-form textarea,#q-form select,.lead-form input,.lead-form textarea,.lead-form select{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:12px;font-size:.95rem}
#q-form .row,.lead-form .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q-send,.q-wa{border:0;border-radius:50px;padding:13px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:block}
.q-send{background:var(--gradient);color:#fff}.q-wa{background:#25d366;color:#fff}
.q-msg{font-size:.9rem;padding:8px 12px;border-radius:10px}.q-msg.ok{background:#e8f8ee;color:#176b3a}.q-msg.err{background:#fdeaea;color:#a02020}
.up-sec{max-width:1100px;margin:70px auto;padding:0 20px}
.up-sec h2{text-align:center;color:var(--primary);font-size:2rem;margin-bottom:8px}
.up-sec>p.sub{text-align:center;color:var(--text-light);margin-bottom:30px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.step{background:var(--card-bg);border:1px solid var(--border-light);border-radius:18px;padding:22px;text-align:center}
.step span{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--gradient);color:#fff;font-weight:700;margin-bottom:10px}
.faq details{background:var(--card-bg);border:1px solid var(--border-light);border-radius:14px;padding:14px 18px;margin-bottom:10px}
.faq summary{font-weight:700;color:var(--primary);cursor:pointer}.faq p{margin-top:8px;color:var(--text-light)}
.lead-form{background:var(--card-bg);border:1px solid var(--border-light);border-radius:20px;padding:26px;display:grid;gap:10px;max-width:640px;margin:0 auto}
@media(max-width:600px){#q-fab{left:16px}.lead-form .row,#q-form .row{grid-template-columns:1fr}}

/* Cleaner cards: no category badge, no in-house label */
.product-card .product-badge{display:none!important}
.product-card.is-inhouse .brand-subtitle>span:first-child{display:none}
.product-card.is-inhouse .brand-subtitle{justify-content:flex-start!important}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tile{border:1px solid var(--border-light);background:var(--card-bg);border-radius:18px;padding:20px 12px;font-weight:700;color:var(--primary);cursor:pointer;transition:.2s}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(43,46,131,.15)}
.tile span{display:block;font-size:1.9rem;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.chips span{padding:9px 18px;border-radius:50px;background:var(--card-bg);border:1px solid var(--border-light);color:var(--primary);font-weight:700}

</style>
</head><body><main style="font-family:Arial,sans-serif;max-width:900px;margin:60px auto;padding:0 24px;color:#222"><h1>Sterling Prime 3D redesign concept</h1><p>Standalone concept preview is available as a downloadable HTML file. This branch file reserves the concept route without touching the main site.</p><p><a href="https://rajaqwe.github.io/sterling-primeB-website/#gallery">Open current Sterling Prime catalogue</a></p></main></body></html>
